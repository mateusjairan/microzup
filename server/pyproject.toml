[project]
name = "microzup-server"
version = "0.1.0"
description = "Microzup — servidor de chat corporativo para LAN"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "python-magic>=0.4.27 ; sys_platform != 'win32'",
    "python-magic-bin>=0.4.14 ; sys_platform == 'win32'",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pyinstaller>=6.22.3",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.7",
    "types-aiofiles>=25.1.0.20261107",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
markers = ["integration: exige PostgreSQL real (TEST_DATABASE_URL)"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "."
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# python-magic/python-magic-bin não publicam stubs nem py.typed.
[[tool.mypy.overrides]]
module = ["magic"]
ignore_missing_imports = true
